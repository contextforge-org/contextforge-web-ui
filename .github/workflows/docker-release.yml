# ===============================================================
# 🐳  Docker Release - build, sign, and publish tagged images
# ===============================================================
#   - fires on version tag pushes (vX.Y.Z, matching the repo's manual
#     tagging convention — see git tag history)
#   - builds the single combined image (Dockerfile) for linux/amd64 +
#     linux/arm64, pushes it to GHCR
#   - signs the pushed tags with Cosign (keyless OIDC) and attaches an SBOM
#   - cuts a GitHub Release for the tag with auto-generated notes, the
#     pull command, and the SBOM as a release asset
# ---------------------------------------------------------------

name: Docker Release

on:
  push:
    # Strict semver only (vX.Y.Z, vX.Y.Z-pre) — matches the type=semver
    # patterns below. A looser "v*" would let non-semver tags (v1, v1.2,
    # v2.0.0.1) through and produce empty derived tags.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      nodejs_image:
        description: "Override NODEJS_IMAGE build arg (e.g. internal mirror) — use if registry.access.redhat.com is unreachable. Leave blank for the Dockerfile default. Dispatch this run from the tag you want to (re)release."
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-sign-release:
    name: Build, Sign & Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub Release
      packages: write # push to GHCR
      id-token: write # Cosign keyless (OIDC) signing

    steps:
      - name: ⬇️  Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: 🔡  Set image name lowercase
        run: |
          IMAGE_NAME_LC=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME_LC=${IMAGE_NAME_LC}" >> "${GITHUB_ENV}"

      - name: 🧰  Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: 🧰  Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: 🔐  Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️  Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          # Skip the "latest" tag for prerelease refs (e.g. v1.0.0-RC-3) so
          # they never clobber the stable tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: ✅  Validate derived tags
        run: |
          set -euo pipefail
          if [ -z "${{ steps.meta.outputs.tags }}" ]; then
            echo "::error::No image tags derived from ref '${{ github.ref_name }}'. Expected strict semver (vX.Y.Z or vX.Y.Z-prerelease)."
            exit 1
          fi

      - name: 🏗️  Build & push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Lets a maintainer re-dispatch this workflow (from the tag) with
          # an internal mirror if registry.access.redhat.com is unreachable
          # — see the workflow_dispatch input above.
          build-args: |
            ${{ github.event.inputs.nodejs_image && format('NODEJS_IMAGE={0}', github.event.inputs.nodejs_image) || '' }}

      - name: 🔏  Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: 🔏  Sign published tags (keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}"
          DIGEST="${{ steps.build.outputs.digest }}"
          echo "Signing ${IMAGE}@${DIGEST}"
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: 📋  Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}@${{ steps.build.outputs.digest }}
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: 📦  Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: sbom.spdx.json
          body: |
            ## Container image

            ```
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ github.ref_name }}
            ```

            Signed with [Cosign](https://docs.sigstore.dev/cosign/overview/) (keyless OIDC) — verify with:

            ```
            cosign verify ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}@${{ steps.build.outputs.digest }} \
              --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.*' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            ```

            Built for `linux/amd64` and `linux/arm64`. SBOM (SPDX) attached below.
            See [DOCKER.md](../../blob/main/DOCKER.md#published-image) for compose/Helm usage.
