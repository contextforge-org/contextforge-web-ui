# ===============================================================
# 🧬 Client Build & Typecheck - validate the production client build
# ===============================================================
#   - runs npm run build to generate API code from committed openapi.json,
#     typecheck the client and Vite configuration, and bundle the SPA
# ---------------------------------------------------------------

name: Client Build & Typecheck

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-client:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Client build and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate API code, typecheck, and build client
        run: npm run build
