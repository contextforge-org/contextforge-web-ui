# ===============================================================
# 🔐  Detect Secrets - Secret Scanning Quality Gate
# ===============================================================
#   - scans staged/changed files for secrets using IBM's
#     hardened detect-secrets fork
#   - requires a committed .secrets.baseline; any new unaudited
#     finding fails the check
#   - runs on PRs and pushes to main
# ---------------------------------------------------------------

name: Detect Secrets

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-secrets:
    name: Detect Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run detect-secrets scan
        run: |
          uv tool run \
            --from 'git+https://github.com/ibm/detect-secrets.git@076672a9a01abdfc7ecee2e7d14f08cdccb73976' \
            detect-secrets scan \
              --update .secrets.baseline \
              --use-all-plugins \
              --exclude-files '(?x)(package-lock\.json$)|^\.secrets\.baseline$|src/i18n/locales/*|openapi.json'

      - name: Fail on unaudited secrets
        run: |
          uv tool run \
            --from 'git+https://github.com/ibm/detect-secrets.git@076672a9a01abdfc7ecee2e7d14f08cdccb73976' \
            detect-secrets audit \
              --report \
              --fail-on-unaudited \
              --fail-on-live \
              .secrets.baseline

      - name: Check baseline is up to date
        run: |
          if ! git diff --exit-code .secrets.baseline; then
            echo "::error::.secrets.baseline is out of date. Run 'npm run secrets:scan' locally, audit any new findings with 'npm run secrets:audit', and commit the updated baseline."
            exit 1
          fi
